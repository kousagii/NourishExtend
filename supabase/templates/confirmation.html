<!doctype html>
<html lang="en">
  <body style="margin:0;background:#FAE6D0;color:#30251F;font-family:Arial,sans-serif;padding:24px;">
    <main style="max-width:480px;margin:auto;background:#FFF9F2;border:1px solid #98785E;border-radius:16px;padding:24px;">
      <h1 style="font-size:24px;line-height:1.4;">Verify your email</h1>
      <p>Enter this code in NourishExtend to confirm your email address:</p>
      <p style="font-size:30px;font-weight:bold;letter-spacing:4px;word-break:break-all;">{{ .Token }}</p>
      <p>Use your latest code. It expires in one hour and can only be used once.</p>
      <p>Do not share this code. If you did not sign up, you can ignore this email.</p>
    </main>
  </body>
</html>
